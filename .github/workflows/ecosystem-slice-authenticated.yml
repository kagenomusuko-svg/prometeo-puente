name: Authenticated ecosystem vertical slice

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout puente
        uses: actions/checkout@v4
      - name: Checkout contexto fijado\n        uses: actions/checkout@v4\n        with:\n          repository: kagenomusuko-svg/prometeo-contexto\n          ref: 6a6223787e3dd4fe94046b7b234cf5981a296f0a\n          token: ${{ secrets.PROMETEO_READ_TOKEN }}\n          path: prometeocontexto\n      - name: Checkout lenguaje fijado\n        uses: actions/checkout@v4\n        with:\n          repository: kagenomusuko-svg/prometeo-lenguaje\n          ref: 181249d721199ddafe495677a46bc01d6cc05b0f\n          token: ${{ secrets.PROMETEO_READ_TOKEN }}\n          path: prometeolenguaje\n      - name: Checkout informe fijado
        uses: actions/checkout@v4
        with:
          repository: kagenomusuko-svg/prometeo-informe
          ref: 0ecc97612efe9a0bd67a3edfeb7733e721a30597
          token: ${{ secrets.PROMETEO_READ_TOKEN }}
          path: prometeoinforme
      - name: Checkout caso fijado
        uses: actions/checkout@v4
        with:
          repository: kagenomusuko-svg/prometeo-caso
          ref: 31ef2e4a1d7e8149b83c575b9918455f5e3cab34
          token: ${{ secrets.PROMETEO_READ_TOKEN }}
          path: prometeocaso

      - name: Checkout proyección fijada
        uses: actions/checkout@v4
        with:
          repository: kagenomusuko-svg/prometeo-proyeccion
          ref: fbd8ae4efdd9e2c0731d722b7c974fb7b692dc3d
          token: ${{ secrets.PROMETEO_READ_TOKEN }}
          path: prometeoproyeccion

      - name: Checkout motor fijado
        uses: actions/checkout@v4
        with:
          repository: kagenomusuko-svg/prometeo-motor-calculo
          ref: 177c8aadeab04ab754a18d8130b48e428eb69772
          token: ${{ secrets.PROMETEO_READ_TOKEN }}
          path: prometeomotor

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install motor
        run: pip install -r prometeomotor/api/requirements.txt

      - name: Start motor
        run: |
          uvicorn api.server:app --app-dir prometeomotor --host 127.0.0.1 --port 8000 > /tmp/prometeo-motor.log 2>&1 &
          for i in $(seq 1 20); do
            curl -sf http://127.0.0.1:8000/docs > /dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8000/docs > /dev/null

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install puente
        run: npm install
      - name: Execute full vertical slice
        env:
          PROMETEO_INFORME_PATH: ${{ github.workspace }}/prometeoinforme/src/report.mjs
          PROMETEO_CASO_PATH: ${{ github.workspace }}/prometeocaso/src/aggregate.mjs\n          PROMETEO_CASO_STORE_PATH: ${{ github.workspace }}/prometeocaso/src/event-store.mjs
          PROMETEO_PROYECCION_PATH: ${{ github.workspace }}/prometeoproyeccion/src/project.mjs
          PROMETEO_MOTOR_URL: http://127.0.0.1:8000/calculate
        run: npm run vertical-slice

      - name: Execute generated vertical slice
        env:
          PROMETEO_CONTEXTO_PATH: ${{ github.workspace }}/prometeocontexto/src/query.mjs
          PROMETEO_LENGUAJE_PATH: ${{ github.workspace }}/prometeolenguaje/src/proposals.mjs
          PROMETEO_CASO_CONFIRMATION_PATH: ${{ github.workspace }}/prometeocaso/src/confirmation.mjs
          PROMETEO_CASO_TRANSITION_PATH: ${{ github.workspace }}/prometeocaso/src/transition.mjs
          PROMETEO_CASO_STORE_PATH: ${{ github.workspace }}/prometeocaso/src/event-store.mjs
          PROMETEO_CASO_AGGREGATE_PATH: ${{ github.workspace }}/prometeocaso/src/aggregate.mjs
          PROMETEO_INFORME_PATH: ${{ github.workspace }}/prometeoinforme/src/report.mjs
          PROMETEO_PROYECCION_PATH: ${{ github.workspace }}/prometeoproyeccion/src/project.mjs
        run: npm run generated-slice
