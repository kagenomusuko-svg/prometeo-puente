name: Ecosystem contract slice

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract-slice:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout puente
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install puente
        run: npm install
      - name: Execute slice through report input
        run: npm run ecosystem-slice
